server.port=8080

spring.datasource.url=jdbc:h2:file:./data/outboxdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jackson.serialization.write-dates-as-timestamps=false

outbox.enabled=true
outbox.dispatcher-instances=2
outbox.poll-interval=200ms
outbox.max-attempts=5
outbox.backoff-initial=100ms
outbox.backoff-multiplier=2.0
outbox.backoff-max=5s
outbox.visibility-timeout=2s
outbox.reclaim-interval=1s
outbox.claim-batch-size=10
