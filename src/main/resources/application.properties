server.port=0

# H2 文件库：进程重启后 outbox 事件仍然存在；AUTO_SERVER 避免嵌入式锁冲突
spring.datasource.url=jdbc:h2:file:./target/h2data/app;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# outbox 投递器
outbox.dispatchers=2
outbox.poll-batch-size=16
outbox.poll-interval-millis=50
outbox.default-max-attempts=5
outbox.backoff-base-millis=100
outbox.backoff-max-millis=5000
outbox.lock-timeout-millis=30000
outbox.recovery-interval-millis=1000

# 本地模拟消息队列
localqueue.queue-name=order.events
localqueue.consumer-workers=2
localqueue.redelivery-delay-millis=200

# 日志：保证能看到事件标识、尝试次数与每次判定结果
logging.level.com.github.lisama569=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
