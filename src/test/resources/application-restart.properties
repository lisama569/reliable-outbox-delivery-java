server.port=0
spring.sql.init.mode=always
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

outbox.dispatchers=2
outbox.poll-interval-millis=20
outbox.recovery-interval-millis=100
outbox.lock-timeout-millis=500
outbox.backoff-base-millis=20
outbox.backoff-max-millis=200
localqueue.redelivery-delay-millis=50
logging.level.com.github.lisama569=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
