server.port=0
# 测试默认使用内存库，各测试类上下文相互隔离
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

outbox.dispatchers=2
outbox.poll-batch-size=16
outbox.poll-interval-millis=20
outbox.default-max-attempts=5
outbox.backoff-base-millis=20
outbox.backoff-max-millis=200
outbox.lock-timeout-millis=120000
outbox.recovery-interval-millis=200

localqueue.queue-name=order.events
localqueue.consumer-workers=2
localqueue.redelivery-delay-millis=50

logging.level.com.github.lisama569=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
